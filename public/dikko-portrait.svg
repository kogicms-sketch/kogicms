<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#009900;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="suitGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b4d0e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGradient)"/>
  
  <!-- Professional portrait silhouette -->
  <g transform="translate(200, 280)" filter="url(#shadow)">
    <!-- Shoulders/Suit -->
    <path d="M-120 120 
             C-120 80, -100 60, -80 50
             L-60 45
             C-40 40, -20 35, 0 35
             C20 35, 40 40, 60 45
             L80 50
             C100 60, 120 80, 120 120
             L120 220
             L-120 220
             Z" 
          fill="url(#suitGradient)"/>
    
    <!-- White Shirt Collar -->
    <path d="M-35 45
             L0 70
             L35 45
             L30 35
             L0 55
             L-30 35
             Z" 
          fill="#ffffff"/>
    
    <!-- Green Tie (APC Color) -->
    <path d="M-8 55
             L8 55
             L12 80
             L0 130
             L-12 80
             Z" 
          fill="#009900"/>
    
    <!-- Neck -->
    <rect x="-25" y="-20" width="50" height="70" fill="url(#skinGradient)"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-60" rx="55" ry="65" fill="url(#skinGradient)"/>
    
    <!-- Hair -->
    <path d="M-55 -70
             C-55 -110, -30 -125, 0 -125
             C30 -125, 55 -110, 55 -70
             C55 -50, 50 -40, 45 -35
             L45 -55
             C45 -85, 25 -100, 0 -100
             C-25 -100, -45 -85, -45 -55
             L-45 -35
             C-50 -40, -55 -50, -55 -70
             Z" 
          fill="#1a1a1a"/>
    
    <!-- Facial Features (subtle) -->
    <!-- Eyes -->
    <ellipse cx="-18" cy="-65" rx="8" ry="5" fill="#1a1a1a" opacity="0.7"/>
    <ellipse cx="18" cy="-65" rx="8" ry="5" fill="#1a1a1a" opacity="0.7"/>
    
    <!-- Eyebrows -->
    <path d="M-28 -75 Q-18 -78, -8 -75" stroke="#1a1a1a" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M8 -75 Q18 -78, 28 -75" stroke="#1a1a1a" stroke-width="3" fill="none" opacity="0.6"/>
    
    <!-- Nose -->
    <path d="M0 -60 L-5 -40 L5 -40 Z" fill="#6b4d0e" opacity="0.5"/>
    
    <!-- Mouth -->
    <path d="M-15 -25 Q0 -20, 15 -25" stroke="#5a3d0a" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Ears -->
    <ellipse cx="-58" cy="-55" rx="8" ry="15" fill="url(#skinGradient)"/>
    <ellipse cx="58" cy="-55" rx="8" ry="15" fill="url(#skinGradient)"/>
  </g>
  
  <!-- APC Logo Elements (subtle) -->
  <circle cx="350" cy="80" r="30" fill="#009900" opacity="0.1"/>
  <circle cx="50" cy="420" r="40" fill="#0066cc" opacity="0.1"/>
  
  <!-- Text Label -->
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666" opacity="0.5">
    DIKKO RADDA
  </text>
</svg>