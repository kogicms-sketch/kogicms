<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- APC Flag Design -->
  <!-- Top Green Section -->
  <rect x="0" y="0" width="100" height="100" fill="#009900"/>
  
  <!-- Top White Section with Broom -->
  <rect x="100" y="0" width="100" height="100" fill="#FFFFFF"/>
  
  <!-- Broom Symbol (Simplified) -->
  <g transform="translate(150, 50)">
    <!-- Broom handle -->
    <rect x="-3" y="-30" width="6" height="50" fill="#8B4513" rx="2"/>
    <!-- Broom bristles -->
    <path d="M -15,-20 L -15,10 L 15,10 L 15,-20 Z" fill="#D2691E"/>
    <path d="M -12,-15 L -12,8 M -8,-15 L -8,8 M -4,-15 L -4,8 M 0,-15 L 0,8 M 4,-15 L 4,8 M 8,-15 L 8,8 M 12,-15 L 12,8" 
          stroke="#8B4513" stroke-width="1.5"/>
  </g>
  
  <!-- Top Blue Section -->
  <rect x="200" y="0" width="100" height="100" fill="#0064C8"/>
  
  <!-- Bottom Red Section -->
  <rect x="0" y="100" width="300" height="100" fill="#E30613"/>
  
  <!-- APC Text -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="#FFFFFF" text-anchor="middle">APC</text>
</svg>
